# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  workflow_dispatch:

jobs:
  build-jdk17-test-with-jdk8:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          java: 8
          arch: arm64
          runner: ubuntu-24.04-arm
          expander_leg: ubuntu-latest-8-arm64
    if: github.repository == 'apache/shardingsphere-elasticjob'
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.java }}
      id: setup-test-jdk
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: ${{ matrix.java }}
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'maven'
    - name: Build with JDK 17
      run: ./mvnw --batch-mode --no-transfer-progress 
        '-Dmaven.javadoc.skip=true' clean install -DskipTests -T1C
    - name: Run Tests with JDK ${{ matrix.java }}
      shell: bash
      run: JAVA_HOME='${{ steps.setup-test-jdk.outputs.path }}' ./mvnw 
        --batch-mode --no-transfer-progress surefire:test -fae -T1C
    name: build-jdk17-test-with-jdk8 [${{ matrix.expander_leg }}]
    timeout-minutes: 150
